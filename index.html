<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天吃什麼？夜市轉盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1E1B4B;
    --night-2: #2A2660;
    --red: #E63946;
    --red-dark: #9E1B2A;
    --yellow: #FFD166;
    --pink: #FF6FB5;
    --mint: #06D6A0;
    --sky: #4CC9F0;
    --paper: #FFF8E7;
    --font: "Huninn", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--night);
    color: var(--paper);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.6;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- 招牌標題 ---------- */
  .sign {
    position: relative;
    width: min(560px, calc(100% - 40px));
    margin: 32px auto 12px;
    padding: 30px 34px 28px;
    background: var(--red);
    border-radius: 22px;
    text-align: center;
    transform: rotate(-1.5deg);
    box-shadow: 0 8px 0 var(--red-dark);
  }
  .sign::before {
    content: "";
    position: absolute;
    inset: 10px;
    pointer-events: none;
    --dot: radial-gradient(circle, var(--yellow) 0 3.5px, transparent 4.5px);
    background:
      var(--dot) top / 22px 12px round no-repeat,
      var(--dot) bottom / 22px 12px round no-repeat,
      var(--dot) left / 12px 22px no-repeat round,
      var(--dot) right / 12px 22px no-repeat round;
    filter: drop-shadow(0 0 4px rgba(255, 209, 102, .8));
  }
  .sign h1 {
    margin: 0;
    font-size: clamp(2.3rem, 8vw, 3.6rem);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: .04em;
    color: var(--yellow);
    text-shadow: 3px 3px 0 var(--night), 0 0 18px rgba(255, 209, 102, .45);
  }

  /* ---------- 版面 ---------- */
  main {
    width: min(1080px, 100%);
    margin: 0 auto;
    padding: 20px 16px 56px;
    display: grid;
    gap: 28px;
  }
  .layout { display: grid; gap: 28px; }
  @media (min-width: 860px) {
    .layout { grid-template-columns: minmax(300px, 380px) 1fr; gap: 40px; align-items: start; }
  }

  .panel {
    margin: 0;
    padding: 20px;
    background: var(--night-2);
    border: 3px solid rgba(255, 248, 231, .14);
    border-radius: 20px;
    min-width: 0;
  }
  fieldset.panel:disabled { opacity: .6; }
  .group + .group { margin-top: 20px; }
  .group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .group h2, .history h2 { margin: 0 0 10px; font-size: 1.1rem; font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    --c: var(--yellow);
    padding: 6px 14px;
    border: 2.5px solid var(--c);
    border-radius: 999px;
    background: transparent;
    color: var(--c);
    line-height: 1.4;
    transition: transform .12s, background-color .12s, color .12s;
  }
  .chip[aria-pressed="true"] { background: var(--c); color: var(--night); }
  .chip:active:not(:disabled) { transform: scale(.94); }
  .text-btn {
    padding: 2px 4px;
    border: 0;
    background: none;
    color: var(--sky);
    text-decoration: underline;
    text-underline-offset: 3px;
    font-size: .95rem;
  }

  /* 國旗按鈕 */
  .flag-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .flag-btn {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 9px 2px 6px;
    border: 2.5px solid rgba(255, 248, 231, .12);
    border-radius: 14px;
    background: transparent;
    color: rgba(255, 248, 231, .5);
    font-size: .8rem; line-height: 1.2;
    transition: transform .12s, border-color .12s, background-color .12s;
  }
  .flag-btn .flag { width: 44px; filter: grayscale(1); opacity: .35; transition: filter .15s, opacity .15s; }
  .flag-btn[aria-pressed="true"] { border-color: var(--mint); background: rgba(6, 214, 160, .14); color: var(--paper); }
  .flag-btn[aria-pressed="true"] .flag { filter: none; opacity: 1; }
  .flag-btn:active:not(:disabled) { transform: scale(.94); }
  .flag { display: block; aspect-ratio: 3 / 2; height: auto; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); }
  .card .tags .flag { display: inline-block; width: 20px; margin-right: 5px; vertical-align: -2px; border-radius: 2px; }

  /* 預算拉桿 */
  .budget-value { color: var(--pink); font-size: 1.25rem; }
  .budget {
    --pct: 100%;
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; height: 32px; margin: 2px 0 0;
    background: transparent;
    cursor: pointer;
  }
  .budget::-webkit-slider-runnable-track {
    height: 10px; border-radius: 999px;
    background: linear-gradient(to right, var(--pink) var(--pct), rgba(255, 248, 231, .18) var(--pct));
  }
  .budget::-moz-range-track {
    height: 10px; border-radius: 999px;
    background: linear-gradient(to right, var(--pink) var(--pct), rgba(255, 248, 231, .18) var(--pct));
  }
  .budget::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; margin-top: -9px;
    border-radius: 50%;
    background: var(--paper);
    border: 5px solid var(--pink);
    box-shadow: 0 3px 0 rgba(0, 0, 0, .35);
    cursor: grab;
  }
  .budget::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--paper);
    border: 5px solid var(--pink);
    box-shadow: 0 3px 0 rgba(0, 0, 0, .35);
    cursor: grab;
  }
  .budget:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.1); }
  .budget-scale { display: flex; justify-content: space-between; color: rgba(255, 248, 231, .55); font-size: .85rem; }

  /* 開關 */
  .switch {
    display: flex; align-items: center; gap: 12px;
    margin-top: 22px; padding-top: 18px;
    border-top: 2px dashed rgba(255, 248, 231, .18);
    cursor: pointer;
  }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track {
    position: relative; flex: none;
    width: 52px; height: 30px;
    border-radius: 999px;
    background: rgba(255, 248, 231, .2);
    transition: background-color .2s;
  }
  .track::after {
    content: ""; position: absolute; top: 4px; left: 4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--paper);
    transition: transform .2s;
  }
  .switch input:checked + .track { background: var(--pink); }
  .switch input:checked + .track::after { transform: translateX(22px); }
  .switch input:focus-visible + .track { outline: 3px solid var(--sky); outline-offset: 3px; }
  .switch small { display: block; color: rgba(255, 248, 231, .65); font-size: .85rem; }

  /* ---------- 轉盤 ---------- */
  .wheel-stage { display: flex; flex-direction: column; align-items: center; }
  .wheel-wrap {
    --size: min(84vw, 440px);
    position: relative;
    width: var(--size);
    height: var(--size);
    margin-top: 22px;
    padding: 26px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 0 6px var(--yellow), 0 10px 0 6px var(--red-dark), 0 0 60px rgba(255, 209, 102, .25);
  }
  .bulb {
    position: absolute; left: 50%; top: 50%;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--yellow);
    box-shadow: 0 0 8px 2px rgba(255, 209, 102, .85);
    transform: translate(-50%, -50%) rotate(var(--a)) translateY(calc(var(--size) / -2 + 13px));
    animation: blink 1.2s steps(1) infinite;
  }
  .bulb.alt { animation-delay: .6s; }
  .wheel-wrap.spinning .bulb { animation-duration: .3s; }
  .wheel-wrap.spinning .bulb.alt { animation-delay: .15s; }
  @keyframes blink {
    0% { opacity: 1; }
    50% { opacity: .3; box-shadow: none; }
  }
  #wheel {
    display: block;
    width: 100%; height: 100%;
    border-radius: 50%;
    transition: transform 4s cubic-bezier(.15, .75, .12, 1);
  }
  .pointer {
    position: absolute; top: -20px; left: 50%; z-index: 3;
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 36px solid var(--yellow);
    transform: translateX(-50%);
    filter: drop-shadow(0 4px 0 var(--night));
  }
  .hub {
    position: absolute; left: 50%; top: 50%; z-index: 2;
    width: 20%; aspect-ratio: 1;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--night);
    border: 5px solid var(--yellow);
    color: var(--yellow);
    font-size: clamp(1.2rem, 5vw, 1.8rem);
    transform: translate(-50%, -50%);
  }
  .hub[hidden] { display: none; }
  .wheel-empty {
    position: absolute; left: 50%; top: 50%; z-index: 2;
    width: 70%; margin: 0; padding: 18px 16px;
    background: var(--night);
    border: 3px solid var(--yellow);
    border-radius: 18px;
    text-align: center; font-size: 1.05rem;
    transform: translate(-50%, -50%);
  }
  .wheel-actions { margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .btn {
    padding: 12px 26px;
    border: 3px solid var(--night);
    border-radius: 16px;
    background: var(--paper);
    color: var(--night);
    font-size: 1.1rem;
    box-shadow: 0 5px 0 var(--night);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--night); }
  .btn:disabled { opacity: .45; }
  .btn.spin {
    padding: 14px 44px;
    background: var(--yellow);
    border-color: var(--yellow);
    font-size: 1.5rem;
    box-shadow: 0 6px 0 #C99A2E;
  }
  .btn.spin:active:not(:disabled) { box-shadow: 0 2px 0 #C99A2E; }
  .btn.ghost {
    background: transparent;
    color: var(--paper);
    border-color: rgba(255, 248, 231, .5);
    box-shadow: 0 5px 0 rgba(255, 248, 231, .2);
  }

  /* ---------- 歷史紀錄 ---------- */
  .history-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .history-head { flex-wrap: wrap; }
  .history-head h2 { margin: 0; white-space: nowrap; }
  .history-head .btn { padding: 6px 14px; font-size: .95rem; box-shadow: 0 3px 0 rgba(255, 248, 231, .2); }
  .clear-confirm { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  .clear-confirm[hidden] { display: none; }
  .clear-confirm span { color: var(--pink); font-size: .9rem; }
  .history-head .btn.danger { background: var(--red); border-color: var(--red); color: var(--paper); box-shadow: 0 3px 0 var(--red-dark); }
  .history ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
  @media (min-width: 640px) { .history ol { grid-template-columns: 1fr 1fr; } }
  .history li {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    background: rgba(255, 248, 231, .06);
    border-radius: 14px;
  }
  .history .h-emoji { font-size: 1.6rem; }
  .history .h-name { flex: 1; min-width: 0; }
  .history time { display: block; font-size: .85rem; color: rgba(255, 248, 231, .6); }
  .tag-avoid {
    flex: none;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--pink);
    color: var(--night);
    font-size: .8rem;
  }
  .history-empty { margin: 8px 0 0; color: rgba(255, 248, 231, .7); }

  /* ---------- 結果卡片 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 40;
    display: grid; place-items: center;
    padding: 16px;
    background: rgba(14, 12, 40, .75);
  }
  .modal[hidden] { display: none; }
  .card {
    width: min(360px, 100%);
    padding: 26px 22px 24px;
    background: var(--paper);
    color: var(--night);
    border: 6px solid var(--yellow);
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 10px 0 var(--red);
    animation: pop .45s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card .label { margin: 0; color: var(--red); font-size: 1rem; }
  .card .result-emoji { font-size: 4.5rem; line-height: 1.2; }
  .card h2 { margin: 0; font-size: 2.2rem; font-weight: 400; line-height: 1.25; }
  .card .tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 12px 0 20px; }
  .card .tags span { padding: 2px 10px; border-radius: 999px; background: rgba(30, 27, 75, .08); font-size: .9rem; }
  .card .actions { display: grid; gap: 12px; }
  .card .btn.eat { background: var(--red); border-color: var(--red); color: var(--paper); box-shadow: 0 5px 0 var(--red-dark); }
  .card .btn.eat:active { box-shadow: 0 1px 0 var(--red-dark); }

  #confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; width: 100%; height: 100%; }

  footer { text-align: center; color: rgba(255, 248, 231, .45); font-size: .85rem; padding-bottom: 28px; }

  @media (prefers-reduced-motion: reduce) {
    .bulb { animation: none; }
    .card { animation: none; }
  }
</style>
</head>
<body>

<header class="sign">
  <h1>今天吃什麼？</h1>
</header>

<main>
  <div class="layout">
    <fieldset class="panel" id="filters">
      <legend class="sr-only">篩選條件</legend>

      <div class="group">
        <h2>什麼時候吃</h2>
        <div class="chips" id="timeChips"></div>
      </div>

      <div class="group">
        <div class="group-head">
          <h2 id="budgetTitle">預算（每人）</h2>
          <span class="budget-value" id="budgetValue" aria-hidden="true">不限</span>
        </div>
        <input type="range" class="budget" id="budgetRange" min="30" max="400" step="10" value="400"
               aria-labelledby="budgetTitle">
        <div class="budget-scale" aria-hidden="true"><span>30 元</span><span>不限</span></div>
      </div>

      <div class="group">
        <div class="group-head">
          <h2>想吃哪一國</h2>
          <button type="button" class="text-btn" id="toggleAllCuisine">清空</button>
        </div>
        <div class="flag-grid" id="cuisineChips"></div>
      </div>

      <label class="switch">
        <input type="checkbox" id="avoidToggle" role="switch">
        <span class="track" aria-hidden="true"></span>
        <span>避開最近吃過的<small>最近 3 筆紀錄不會上轉盤</small></span>
      </label>
    </fieldset>

    <section class="wheel-stage" aria-label="轉盤">
      <div class="wheel-wrap" id="wheelWrap">
        <div id="bulbs" aria-hidden="true"></div>
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" width="840" height="840" role="img" aria-label="餐點轉盤"></canvas>
        <div class="hub" id="hub" aria-hidden="true">吃</div>
        <p class="wheel-empty" id="wheelEmpty" hidden>符合條件的太少了，<br>放寬一點吧！</p>
      </div>
      <div class="wheel-actions">
        <button type="button" class="btn spin" id="spinBtn">開轉！</button>
        <button type="button" class="btn ghost" id="shuffleBtn">換一批</button>
      </div>
    </section>
  </div>

  <section class="panel history" aria-labelledby="historyTitle">
    <div class="history-head">
      <h2 id="historyTitle">最近吃過</h2>
      <button type="button" class="btn ghost" id="clearBtn">清除紀錄</button>
      <div class="clear-confirm" id="clearConfirm" hidden>
        <span>清除後無法復原</span>
        <button type="button" class="btn danger" id="clearYes">確定清除</button>
        <button type="button" class="btn ghost" id="clearNo">取消</button>
      </div>
    </div>
    <ol id="historyList"></ol>
    <p class="history-empty" id="historyEmpty">還沒有紀錄。轉到想吃的，按「就吃這個！」就會記在這裡。</p>
  </section>
</main>

<footer>紀錄只存在這台裝置的瀏覽器裡</footer>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="resultName">
    <p class="label">今天就吃</p>
    <div class="result-emoji" id="resultEmoji"></div>
    <h2 id="resultName"></h2>
    <div class="tags" id="resultTags"></div>
    <div class="actions">
      <button type="button" class="btn eat" id="eatBtn">就吃這個！</button>
      <button type="button" class="btn" id="againBtn">再轉一次</button>
    </div>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  // ---------- 餐點資料 ----------
  // t: 時段, p: 一人份的普遍價格（新台幣）, c: 種類
  const FOODS = [
    { n: '蛋餅', e: '🥞', t: ['早餐'], p: 35, c: '台式小吃' },
    { n: '蘿蔔糕', e: '🍳', t: ['早餐'], p: 40, c: '台式小吃' },
    { n: '飯糰', e: '🍙', t: ['早餐'], p: 45, c: '台式小吃' },
    { n: '鐵板麵', e: '🍝', t: ['早餐'], p: 55, c: '台式小吃' },
    { n: '蔥抓餅', e: '🫓', t: ['早餐', '宵夜'], p: 40, c: '台式小吃' },
    { n: '燒餅油條', e: '🥖', t: ['早餐'], p: 50, c: '中式' },
    { n: '小籠包', e: '🥟', t: ['早餐', '正餐'], p: 90, c: '中式' },
    { n: '三明治', e: '🥪', t: ['早餐'], p: 45, c: '美式' },
    { n: '鬆餅', e: '🧇', t: ['早餐'], p: 180, c: '美式' },
    { n: '美式早午餐', e: '🍳', t: ['早餐', '正餐'], p: 260, c: '美式' },
    { n: '韓式飯捲', e: '🍙', t: ['早餐', '正餐'], p: 90, c: '韓式' },
    { n: '越南法國麵包', e: '🥖', t: ['早餐', '正餐'], p: 80, c: '東南亞' },

    { n: '牛肉麵', e: '🍜', t: ['正餐', '宵夜'], p: 170, c: '中式' },
    { n: '水餃', e: '🥟', t: ['正餐', '宵夜'], p: 80, c: '中式' },
    { n: '炒飯', e: '🍚', t: ['正餐', '宵夜'], p: 90, c: '中式' },
    { n: '燒臘飯', e: '🍖', t: ['正餐'], p: 110, c: '中式' },

    { n: '滷肉飯', e: '🍚', t: ['正餐', '宵夜'], p: 50, c: '台式小吃' },
    { n: '雞排', e: '🍗', t: ['宵夜'], p: 85, c: '台式小吃' },
    { n: '鹽酥雞', e: '🍢', t: ['宵夜'], p: 100, c: '台式小吃' },
    { n: '蚵仔煎', e: '🦪', t: ['正餐', '宵夜'], p: 75, c: '台式小吃' },
    { n: '臭豆腐', e: '🧆', t: ['正餐', '宵夜'], p: 60, c: '台式小吃' },
    { n: '自助餐便當', e: '🍱', t: ['正餐'], p: 100, c: '台式小吃' },

    { n: '拉麵', e: '🍜', t: ['正餐', '宵夜'], p: 280, c: '日式' },
    { n: '壽司', e: '🍣', t: ['正餐'], p: 300, c: '日式' },
    { n: '咖哩飯', e: '🍛', t: ['正餐'], p: 150, c: '日式' },
    { n: '豬排飯', e: '🍱', t: ['正餐'], p: 180, c: '日式' },
    { n: '牛丼', e: '🍚', t: ['正餐', '宵夜'], p: 120, c: '日式' },
    { n: '烏龍麵', e: '🍜', t: ['正餐'], p: 130, c: '日式' },

    { n: '韓式炸雞', e: '🍗', t: ['正餐', '宵夜'], p: 250, c: '韓式' },
    { n: '石鍋拌飯', e: '🥘', t: ['正餐'], p: 200, c: '韓式' },
    { n: '部隊鍋', e: '🍲', t: ['正餐', '宵夜'], p: 300, c: '韓式' },
    { n: '辣炒年糕', e: '🌶️', t: ['正餐', '宵夜'], p: 100, c: '韓式' },

    { n: '白醬義大利麵', e: '🍝', t: ['正餐'], p: 220, c: '義式' },
    { n: '青醬義大利麵', e: '🍝', t: ['正餐'], p: 220, c: '義式' },
    { n: '披薩', e: '🍕', t: ['正餐', '宵夜'], p: 250, c: '義式' },
    { n: '燉飯', e: '🥘', t: ['正餐'], p: 240, c: '義式' },
    { n: '焗烤飯', e: '🧀', t: ['正餐'], p: 120, c: '義式' },

    { n: '漢堡', e: '🍔', t: ['早餐', '正餐'], p: 90, c: '美式' },
    { n: '美式炸雞', e: '🍗', t: ['正餐', '宵夜'], p: 120, c: '美式' },
    { n: '熱狗堡', e: '🌭', t: ['宵夜'], p: 70, c: '美式' },
    { n: '牛排', e: '🥩', t: ['正餐'], p: 350, c: '美式' },

    { n: '打拋豬飯', e: '🍛', t: ['正餐'], p: 110, c: '東南亞' },
    { n: '越南河粉', e: '🍜', t: ['正餐'], p: 130, c: '東南亞' },
    { n: '海南雞飯', e: '🐔', t: ['正餐'], p: 120, c: '東南亞' },
    { n: '綠咖哩', e: '🍛', t: ['正餐'], p: 180, c: '東南亞' },
    { n: '泰式炒河粉', e: '🍤', t: ['正餐', '宵夜'], p: 160, c: '東南亞' },
  ];

  const TIMES = ['不限', '早餐', '正餐', '宵夜'];
  const BUDGET_MAX = 400; // 拉到最右邊 = 不限
  const CUISINES = ['中式', '台式小吃', '日式', '韓式', '義式', '美式', '東南亞'];

  // ---------- 國旗圖示（用 SVG 畫，Windows 也能正常顯示） ----------
  function starPts(cx, cy, R, r, n = 5, rot = -90) {
    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const ang = ((rot + (i * 180) / n) * Math.PI) / 180;
      const rad = i % 2 ? r : R;
      pts.push(`${(cx + rad * Math.cos(ang)).toFixed(2)},${(cy + rad * Math.sin(ang)).toFixed(2)}`);
    }
    return pts.join(' ');
  }
  const star = (cx, cy, R, fill, rot = -90) =>
    `<polygon points="${starPts(cx, cy, R, R * 0.382, 5, rot)}" fill="${fill}"/>`;

  const FLAG_ART = {
    中式: () =>
      `<rect width="30" height="20" fill="#DE2910"/>${star(5, 5, 3, '#FFDE00')}` +
      star(10, 2, 1, '#FFDE00', -50) + star(12, 4, 1, '#FFDE00', -70) +
      star(12, 7, 1, '#FFDE00', -90) + star(10, 9, 1, '#FFDE00', -110),
    台式小吃: () =>
      `<rect width="30" height="20" fill="#FE0000"/><rect width="15" height="10" fill="#000095"/>` +
      `<polygon points="${starPts(7.5, 5, 3.75, 2.1, 12)}" fill="#fff"/>` +
      `<circle cx="7.5" cy="5" r="2.1" fill="#000095"/><circle cx="7.5" cy="5" r="1.75" fill="#fff"/>`,
    日式: () => `<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#BC002D"/>`,
    韓式: () => {
      const trigram = (x) => [-1.1, 0, 1.1].map((d) =>
        `<rect x="${x + d - 0.35}" y="-2.2" width="0.7" height="4.4" fill="#000"/>`).join('');
      return `<rect width="30" height="20" fill="#fff"/>` +
        `<g transform="translate(15 10) rotate(33.69)"><circle r="5" fill="#0047A0"/>` +
        `<path d="M5 0A5 5 0 0 0 -5 0A2.5 2.5 0 0 0 0 0A2.5 2.5 0 0 1 5 0Z" fill="#CD2E3A"/>` +
        `${trigram(-8.6)}${trigram(8.6)}</g>` +
        `<g transform="translate(15 10) rotate(-33.69)">${trigram(-8.6)}${trigram(8.6)}</g>`;
    },
    義式: () =>
      `<rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#fff"/>` +
      `<rect x="20" width="10" height="20" fill="#CE2B37"/>`,
    美式: () => {
      const h = 20 / 13;
      let out = '<rect width="30" height="20" fill="#fff"/>';
      for (let i = 0; i < 13; i += 2) out += `<rect y="${(i * h).toFixed(2)}" width="30" height="${h.toFixed(2)}" fill="#B22234"/>`;
      out += `<rect width="12" height="${(7 * h).toFixed(2)}" fill="#3C3B6E"/>`;
      for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++)
        out += `<circle cx="${1.4 + c * 2.3}" cy="${1.5 + r * 2.5}" r="0.45" fill="#fff"/>`;
      return out;
    },
    // 東南亞：泰國＋越南，斜切成一面
    東南亞: (id) =>
      `<defs><clipPath id="${id}a"><polygon points="0,0 30,0 0,20"/></clipPath>` +
      `<clipPath id="${id}b"><polygon points="30,0 30,20 0,20"/></clipPath></defs>` +
      `<g clip-path="url(#${id}a)"><rect width="30" height="20" fill="#A51931"/>` +
      `<rect y="3.33" width="30" height="13.33" fill="#F4F5F8"/><rect y="6.67" width="30" height="6.67" fill="#2D2A4A"/></g>` +
      `<g clip-path="url(#${id}b)"><rect width="30" height="20" fill="#DA251D"/>${star(19, 12, 4.5, '#FFFF00')}</g>`,
  };
  let flagSeq = 0;
  function flagSVG(cuisine) {
    const id = `flag${++flagSeq}`;
    return `<svg class="flag" viewBox="0 0 30 20" aria-hidden="true">${FLAG_ART[cuisine](id)}</svg>`;
  }
  const SLICE_COLORS = ['#E63946', '#FFD166', '#FF6FB5', '#06D6A0', '#4CC9F0'];
  const MAX_SLICES = 12;
  const AVOID_COUNT = 3;
  const SHOW_HISTORY = 10;
  const STORAGE_KEY = 'dinner-wheel:v1';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPIN_MS = reducedMotion ? 1000 : 4000;

  const state = {
    time: '不限',
    budget: BUDGET_MAX,
    cuisines: new Set(CUISINES),
    avoid: true,
    history: [],     // { n, e, at }
    pool: [],        // 符合條件的全部餐點
    wheel: [],       // 目前放在轉盤上的餐點
    rotation: 0,
    spinning: false,
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    filters: $('filters'), timeChips: $('timeChips'), budgetRange: $('budgetRange'), budgetValue: $('budgetValue'),
    cuisineChips: $('cuisineChips'), toggleAll: $('toggleAllCuisine'), avoid: $('avoidToggle'),
    wrap: $('wheelWrap'), bulbs: $('bulbs'), canvas: $('wheel'), hub: $('hub'), empty: $('wheelEmpty'),
    spin: $('spinBtn'), shuffle: $('shuffleBtn'),
    historyList: $('historyList'), historyEmpty: $('historyEmpty'), clear: $('clearBtn'),
    clearConfirm: $('clearConfirm'), clearYes: $('clearYes'), clearNo: $('clearNo'),
    modal: $('modal'), rEmoji: $('resultEmoji'), rName: $('resultName'), rTags: $('resultTags'),
    eat: $('eatBtn'), again: $('againBtn'), confetti: $('confetti'),
  };

  // ---------- 儲存 ----------
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (data) {
        if (Array.isArray(data.history)) state.history = data.history;
        if (typeof data.avoid === 'boolean') state.avoid = data.avoid;
      }
    } catch (e) { /* 讀不到就用預設值 */ }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ history: state.history, avoid: state.avoid }));
    } catch (e) { /* 無法儲存時仍可正常使用 */ }
  }

  // ---------- 篩選按鈕 ----------
  function makeChip(label, pressed, color, onClick) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = label;
    b.setAttribute('aria-pressed', String(pressed));
    b.style.setProperty('--c', color);
    b.addEventListener('click', onClick);
    return b;
  }

  function renderFilters() {
    els.timeChips.replaceChildren(...TIMES.map((t) =>
      makeChip(t, state.time === t, 'var(--yellow)', () => { state.time = t; renderFilters(); refreshWheel(); })
    ));
    els.cuisineChips.replaceChildren(...CUISINES.map((c) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'flag-btn';
      b.setAttribute('aria-pressed', String(state.cuisines.has(c)));
      b.innerHTML = `${flagSVG(c)}<span>${c}</span>`;
      b.addEventListener('click', () => {
        state.cuisines.has(c) ? state.cuisines.delete(c) : state.cuisines.add(c);
        renderFilters(); refreshWheel();
      });
      return b;
    }));
    els.toggleAll.textContent = state.cuisines.size === CUISINES.length ? '清空' : '全選';
    els.avoid.checked = state.avoid;
  }

  function renderBudget() {
    const r = els.budgetRange;
    const v = state.budget;
    const text = v >= BUDGET_MAX ? '不限' : `${v} 元以內`;
    els.budgetValue.textContent = text;
    r.value = v;
    r.setAttribute('aria-valuetext', text);
    r.style.setProperty('--pct', `${((v - r.min) / (r.max - r.min)) * 100}%`);
  }

  els.budgetRange.addEventListener('input', () => {
    state.budget = Number(els.budgetRange.value);
    renderBudget();
    refreshWheel();
  });

  els.toggleAll.addEventListener('click', () => {
    state.cuisines = state.cuisines.size === CUISINES.length ? new Set() : new Set(CUISINES);
    renderFilters(); refreshWheel();
  });
  els.avoid.addEventListener('change', () => {
    state.avoid = els.avoid.checked;
    save(); refreshWheel(); renderHistory();
  });

  // ---------- 轉盤內容 ----------
  function recentNames() {
    return new Set(state.history.slice(0, AVOID_COUNT).map((h) => h.n));
  }

  function computePool() {
    const recent = state.avoid ? recentNames() : new Set();
    return FOODS.filter((f) =>
      (state.time === '不限' || f.t.includes(state.time)) &&
      (state.budget >= BUDGET_MAX || f.p <= state.budget) &&
      state.cuisines.has(f.c) &&
      !recent.has(f.n)
    );
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function refreshWheel(force = false) {
    const pool = computePool();
    const same = pool.length === state.pool.length && pool.every((f, i) => f === state.pool[i]);
    state.pool = pool;
    if (same && !force && state.wheel.length) return;
    const n = pool.length;
    state.wheel = n < 2 ? [] : shuffle(pool).slice(0, MAX_SLICES);

    els.empty.hidden = n >= 2;
    els.hub.hidden = n < 2;
    els.spin.disabled = n < 2;
    els.shuffle.disabled = n <= MAX_SLICES;
    drawWheel();
  }

  els.shuffle.addEventListener('click', () => refreshWheel(true));

  // ---------- 畫轉盤 ----------
  function sliceColor(i, n) {
    // 避免最後一格和第一格同色
    if (n > 1 && i === n - 1 && (n - 1) % SLICE_COLORS.length === 0) return SLICE_COLORS[2];
    return SLICE_COLORS[i % SLICE_COLORS.length];
  }

  function drawWheel() {
    const cv = els.canvas;
    const ctx = cv.getContext('2d');
    const S = cv.width;
    const c = S / 2;
    const r = c - 4;
    ctx.clearRect(0, 0, S, S);

    const items = state.wheel;
    if (!items.length) {
      ctx.beginPath();
      ctx.arc(c, c, r, 0, Math.PI * 2);
      ctx.fillStyle = '#2A2660';
      ctx.fill();
      return;
    }

    const n = items.length;
    const a = (Math.PI * 2) / n;
    const fontSize = n <= 6 ? 52 : n <= 9 ? 46 : 40;

    items.forEach((f, i) => {
      const start = -Math.PI / 2 + i * a;
      const color = sliceColor(i, n);
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, start, start + a);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#1E1B4B';
      ctx.stroke();

      // 左半邊的字翻轉 180 度，避免靜止時看到倒過來的字
      const mid = start + a / 2;
      const leftSide = Math.cos(mid) < -0.01;
      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(leftSide ? mid + Math.PI : mid);
      ctx.font = `${fontSize}px Huninn, "PingFang TC", "Microsoft JhengHei", sans-serif`;
      ctx.textAlign = leftSide ? 'left' : 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color === '#E63946' ? '#FFF8E7' : '#1E1B4B';
      if (leftSide) ctx.fillText(`${f.e} ${f.n}`, -(r - 34), 2, r - 130);
      else ctx.fillText(`${f.n} ${f.e}`, r - 34, 2, r - 130);
      ctx.restore();
    });
  }

  // 轉盤外圈燈泡
  for (let i = 0; i < 24; i++) {
    const b = document.createElement('span');
    b.className = 'bulb' + (i % 2 ? ' alt' : '');
    b.style.setProperty('--a', `${i * 15}deg`);
    els.bulbs.appendChild(b);
  }

  // ---------- 轉動 ----------
  function spin() {
    if (state.spinning || state.wheel.length < 2) return;
    state.spinning = true;
    els.filters.disabled = true;
    els.spin.disabled = true;
    els.shuffle.disabled = true;
    els.wrap.classList.add('spinning');

    const n = state.wheel.length;
    const slice = 360 / n;
    const index = Math.floor(Math.random() * n);
    // 指針在正上方；讓第 index 格的中心（加一點隨機偏移）停在指針下
    const jitter = (Math.random() * 2 - 1) * slice * 0.35;
    const target = (((360 - (index + 0.5) * slice + jitter) % 360) + 360) % 360;
    const current = ((state.rotation % 360) + 360) % 360;
    const delta = (target - current + 360) % 360;
    const turns = reducedMotion ? 1 : 5;
    state.rotation += turns * 360 + delta;

    els.canvas.style.transitionDuration = `${SPIN_MS}ms`;
    els.canvas.style.transform = `rotate(${state.rotation}deg)`;

    setTimeout(() => {
      state.spinning = false;
      els.wrap.classList.remove('spinning');
      showResult(state.wheel[index]);
    }, SPIN_MS + 100);
  }

  els.spin.addEventListener('click', spin);

  // ---------- 結果卡片 ----------
  let currentResult = null;

  function showResult(food) {
    currentResult = food;
    els.rEmoji.textContent = food.e;
    els.rName.textContent = food.n;
    els.rTags.replaceChildren(...[food.c, `約 ${food.p} 元`, food.t.join('、')].map((t, i) => {
      const s = document.createElement('span');
      if (i === 0) s.innerHTML = flagSVG(t);
      s.append(t);
      return s;
    }));
    els.modal.hidden = false;
    els.eat.focus();
    launchConfetti();
  }

  function closeResult() {
    els.modal.hidden = true;
    currentResult = null;
    els.filters.disabled = false;
    els.spin.disabled = state.wheel.length < 2;
    els.shuffle.disabled = state.pool.length <= MAX_SLICES;
    els.spin.focus();
  }

  els.eat.addEventListener('click', () => {
    if (!currentResult) return;
    state.history.unshift({ n: currentResult.n, e: currentResult.e, at: Date.now() });
    state.history = state.history.slice(0, 50);
    save();
    closeResult();
    renderHistory();
    if (state.avoid) refreshWheel();
  });

  els.again.addEventListener('click', () => {
    closeResult();
    spin();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !els.modal.hidden) closeResult();
  });

  // ---------- 歷史紀錄 ----------
  const timeFmt = new Intl.DateTimeFormat('zh-TW', {
    month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false,
  });

  function renderHistory() {
    const list = state.history.slice(0, SHOW_HISTORY);
    els.historyEmpty.hidden = list.length > 0;
    els.clear.disabled = list.length === 0;
    els.historyList.replaceChildren(...list.map((h, i) => {
      const li = document.createElement('li');
      const emoji = document.createElement('span');
      emoji.className = 'h-emoji';
      emoji.textContent = h.e;
      const name = document.createElement('span');
      name.className = 'h-name';
      name.textContent = h.n;
      const time = document.createElement('time');
      time.dateTime = new Date(h.at).toISOString();
      time.textContent = timeFmt.format(new Date(h.at));
      name.appendChild(time);
      li.append(emoji, name);
      if (state.avoid && i < AVOID_COUNT) {
        const tag = document.createElement('span');
        tag.className = 'tag-avoid';
        tag.textContent = '避開中';
        li.appendChild(tag);
      }
      return li;
    }));
  }

  // 用網頁內的確認按鈕，不用瀏覽器的 confirm()（有些環境會擋掉彈窗）
  function showClearConfirm(show) {
    els.clear.hidden = show;
    els.clearConfirm.hidden = !show;
    (show ? els.clearNo : els.clear).focus();
  }

  els.clear.addEventListener('click', () => {
    if (!state.history.length) return;
    showClearConfirm(true);
  });
  els.clearNo.addEventListener('click', () => showClearConfirm(false));
  els.clearYes.addEventListener('click', () => {
    state.history = [];
    save();
    showClearConfirm(false);
    renderHistory();
    refreshWheel();
  });

  // ---------- 紙花 ----------
  function launchConfetti() {
    if (reducedMotion) return;
    const cv = els.confetti;
    const ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colors = ['#E63946', '#FFD166', '#FF6FB5', '#06D6A0', '#4CC9F0', '#FFF8E7'];
    const parts = Array.from({ length: 150 }, () => ({
      x: W / 2 + (Math.random() - 0.5) * 80,
      y: H * 0.45,
      vx: (Math.random() - 0.5) * 16,
      vy: -Math.random() * 15 - 5,
      size: Math.random() * 7 + 5,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      color: colors[Math.floor(Math.random() * colors.length)],
    }));
    const startTime = performance.now();

    function frame(now) {
      const t = now - startTime;
      ctx.clearRect(0, 0, W, H);
      parts.forEach((p) => {
        p.vy += 0.45;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - t / 2600);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      });
      if (t < 2600) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }

  // ---------- 啟動 ----------
  load();
  renderFilters();
  renderBudget();
  renderHistory();
  refreshWheel();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWheel);
})();
</script>
</body>
</html>
